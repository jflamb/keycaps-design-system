name: Keycaps checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The consumer whose files the migration plan cites. `pnpm check` runs
      # `verify:citations`, which resolves every one of them through
      # `git show <pinned-commit>:<path>` — so the repository has to be here, at
      # full depth, or the check fails rather than quietly passing. A sibling
      # clone is the local default; this is its CI equivalent.
      - uses: actions/checkout@v7
        with:
          repository: jflamb/mcp-dnsimple
          path: .consumers/mcp-dnsimple
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          version: 11.16.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Full gate
        env:
          KEYCAPS_CONSUMER_REPO: ${{ github.workspace }}/.consumers/mcp-dnsimple
        run: pnpm check
      - name: Validate affected Storybook stories
        if: github.event_name == 'pull_request'
        env:
          REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          pnpm review:changed --
          --base "$REVIEW_BASE_SHA"
          --head "$REVIEW_HEAD_SHA"
      - name: Retain Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: keycaps-playwright-${{ github.run_id }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            playwright-report
            test-results/playwright
            .review/affected-stories.json
          if-no-files-found: ignore
          retention-days: 14
