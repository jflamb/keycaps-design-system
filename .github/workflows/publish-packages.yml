name: Publish npm packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.16.0
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify release tag and fixed package versions
        run: pnpm release:verify
      - name: Verify source, packages, and browser behavior
        run: pnpm check
      # Authentication is npm trusted publishing: the `id-token: write` permission
      # above plus the `npm` environment are exchanged for a short-lived token at
      # publish time, and both packages disallow bypass-2FA tokens. The bootstrap
      # step that configured a stored NPM_TOKEN is gone with the secret it read —
      # a package can only be trusted once it exists, so v0.1.0 needed one and
      # nothing since does. Leaving the step would mean any future NPM_TOKEN
      # secret silently took precedence over the OIDC identity.
      - name: Publish tokens
        run: pnpm --filter @jflamb/keycaps-tokens publish --access public --provenance --no-git-checks
      - name: Publish React components
        run: pnpm --filter @jflamb/keycaps-react publish --access public --provenance --no-git-checks
